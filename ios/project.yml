# XcodeGen spec for Ghostty iOS — an SSH-first terminal built on libghostty-vt.
#
#   ./build-libvt.sh            # stage Frameworks/ghostty-vt.xcframework
#   xcodegen generate && open Ghostty.xcodeproj
#
# libghostty-vt is consumed as a static-library XCFramework (headers +
# module.modulemap ship inside it, so Swift can `import GhosttyVt`).
# Networking is Apple's swift-nio-ssh; there is no shell on iOS, so the
# terminal's other end is always an SSH channel.

name: Ghostty
options:
  bundleIdPrefix: com.morton
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Andy's free PERSONAL team (Apple ID andrew.haynes@me.com). Personal-team
    # caveats: on-device profiles expire after 7 days, max 3 sideloaded apps.
    DEVELOPMENT_TEAM: XXVMGZB67S
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  swift-nio-ssh:
    url: https://github.com/apple/swift-nio-ssh
    from: 0.15.0
  swift-nio:
    url: https://github.com/apple/swift-nio
    from: 2.65.0
  swift-crypto:
    url: https://github.com/apple/swift-crypto
    from: 3.0.0

targets:
  Ghostty:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
    dependencies:
      # Static library xcframework: link it, do not embed it.
      - framework: Frameworks/ghostty-vt.xcframework
        embed: false
      - package: swift-nio-ssh
        product: NIOSSH
      - package: swift-nio
        product: NIOCore
      - package: swift-nio
        product: NIOPosix
      - package: swift-nio
        product: NIOFoundationCompat
      - package: swift-crypto
        product: Crypto
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.morton.ghostty
        PRODUCT_NAME: Ghostty
        INFOPLIST_FILE: Sources/App/Info.plist
        GENERATE_INFOPLIST_FILE: NO      # we ship an explicit Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"    # iPhone + iPad
        SUPPORTS_MACCATALYST: NO
        # Xcode normally derives these from the linked xcframework, but being
        # explicit keeps `import GhosttyVt` working for every slice.
        "HEADER_SEARCH_PATHS[sdk=iphoneos*]": "$(inherited) $(PROJECT_DIR)/Frameworks/ghostty-vt.xcframework/ios-arm64/Headers"
        "HEADER_SEARCH_PATHS[sdk=iphonesimulator*]": "$(inherited) $(PROJECT_DIR)/Frameworks/ghostty-vt.xcframework/ios-arm64-simulator/Headers"
        "SWIFT_INCLUDE_PATHS[sdk=iphoneos*]": "$(inherited) $(PROJECT_DIR)/Frameworks/ghostty-vt.xcframework/ios-arm64/Headers"
        "SWIFT_INCLUDE_PATHS[sdk=iphonesimulator*]": "$(inherited) $(PROJECT_DIR)/Frameworks/ghostty-vt.xcframework/ios-arm64-simulator/Headers"

  GhosttyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/GhosttyTests
    dependencies:
      - target: Ghostty
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.morton.ghostty.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Ghostty:
    build:
      targets:
        Ghostty: all
        GhosttyTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - GhosttyTests
